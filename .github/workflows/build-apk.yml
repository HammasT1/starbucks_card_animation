name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "images/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          OUT=build/app/outputs/flutter-apk
          PREFIX="starbucks-card-animation-v${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp "$OUT/app-release.apk"             "dist/${PREFIX}-universal.apk"
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/${PREFIX}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/${PREFIX}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/${PREFIX}-x86_64.apk"
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starbucks-card-animation-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.short_sha }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/*.apk"
          generate_release_notes: true
